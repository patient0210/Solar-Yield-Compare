kind = "web"
previewPath = "/"
title = "Solar PV Simulator"
version = "1.0.0"
id = "artifacts/solar-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25799

[services.development]
run = "pnpm --filter @workspace/solar-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/solar-app", "run", "build" ]
publicDir = "artifacts/solar-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25799"
BASE_PATH = "/"
